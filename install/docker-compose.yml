# Nebula — añade este servicio al docker-compose.yml donde tengas Jellyfin y/o Emby.
# Busca solo todos los Jellyfin y Emby del equipo, les pone el carrusel y lo vuelve a poner tras
# cada actualización. No hace falta cambiar nada: copia, pega y «docker compose up -d».
services:
  nebula:
    image: docker:cli
    container_name: nebula
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JELLYFIN_API_KEY=   # opcional: clave de API de Jellyfin → pone también el tema en «CSS personalizado»
      - EMBY_API_KEY=       # opcional: lo mismo para Emby
      - NEBULA_OPTIONS=     # opcional (Jellyfin): p. ej. cabecera-minima,acento-coral
    entrypoint: ["sh", "-c", "apk add -q --no-cache bash curl && curl -fsSL https://raw.githubusercontent.com/nemesbak/jellyfin-nebula/main/install/inject-docker.sh | bash -s -- auto --watch"]
